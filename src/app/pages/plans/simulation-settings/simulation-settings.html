<div class="settings-section">

  <div class="settings-header">

    <h3>
      تنظیمات شبیه‌سازی
    </h3>

    <button
      class="configure-btn"
      (click)="openSettings()">

      تنظیمات

    </button>

  </div>


  <div
    class="modal-overlay"
    *ngIf="showSettings()"
    (click)="closeSettings()">


    <div
      class="modal-box"
      (click)="$event.stopPropagation()">


      <h3>
        پیکربندی شبیه‌سازی
      </h3>


      <div class="form-group">

        <label>
          تاریخ شروع
        </label>

        <input
          type="date"
          [(ngModel)]="settings().start_date">

      </div>


      <div class="form-group">

        <label>
          تاریخ پایان
        </label>

        <input
          type="date"
          [(ngModel)]="settings().end_date">

      </div>


      <div class="form-group">

        <label>
          موجودی اولیه (تومان)
        </label>

        <input
          type="number"
          [(ngModel)]="settings().initial_cash">

      </div>


      <div class="form-group">

        <label>
          درآمد ماهانه (تومان)
        </label>

        <input
          type="number"
          [(ngModel)]="settings().monthly_income">

      </div>


      <div class="form-group">

        <label>
          هزینه ماهانه (تومان)
        </label>

        <input
          type="number"
          [(ngModel)]="settings().monthly_expenses">

      </div>


      <div class="modal-actions">

        <button
          class="btn-cancel"
          (click)="closeSettings()">

          لغو

        </button>


        <button
          class="btn-save"
          (click)="saveSettings()">

          ذخیره

        </button>

      </div>


    </div>


  </div>


</div>
