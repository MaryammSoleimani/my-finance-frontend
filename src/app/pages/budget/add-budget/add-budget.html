<div class="modal-backdrop">


  <div class="modal-box">



    <div class="modal-header">


      <h2>

        {{'budget.create_title' | translate}}

      </h2>



      <button

        class="close-btn"

        type="button"

        (click)="close.emit()">


        ×


      </button>


    </div>







    <div class="input-group">


      <label for="budgetName">


        {{'budget.name' | translate}}


      </label>



      <input

        id="budgetName"

        type="text"

        [(ngModel)]="name"

        [placeholder]="
        'budget.name_placeholder' | translate
        ">


    </div>








    <div class="input-group">



      <label>


        {{'budget.period' | translate}}


      </label>





      <div class="reset-toggle">



        <button

          type="button"

          [class.active]="resetPeriod === 'monthly'"

          (click)="resetPeriod='monthly'">


          {{'budget.monthly' | translate}}


        </button>





        <button

          type="button"

          [class.active]="resetPeriod === 'yearly'"

          (click)="resetPeriod='yearly'">


          {{'budget.yearly' | translate}}


        </button>



      </div>



    </div>









    <div class="input-group">


      <label for="budgetAmount">


        {{'budget.amount' | translate}}


        (

        {{'currency.symbol' | translate}}

        )


      </label>




      <input


        id="budgetAmount"

        type="number"

        min="0"

        [(ngModel)]="amount"

        [placeholder]="
        'budget.amount_placeholder' | translate
        ">


    </div>









    <div class="input-group">


      <label for="budgetCategory">


        {{'budget.category' | translate}}


      </label>




      <select


        id="budgetCategory"

        [(ngModel)]="categoryId">



        <option

          [ngValue]="null"

          disabled>


          {{'budget.select_category' | translate}}


        </option>





        <option

          *ngFor="let cat of categories"

          [value]="cat.id">


          {{cat.name}}


        </option>



      </select>



    </div>









    <div class="modal-actions">



      <button

        type="button"

        class="btn-cancel"

        (click)="close.emit()">



        {{'common.cancel' | translate}}



      </button>







      <button

        type="button"

        class="btn-save"

        (click)="save()">



        {{'budget.save' | translate}}



      </button>



    </div>





  </div>


</div>
