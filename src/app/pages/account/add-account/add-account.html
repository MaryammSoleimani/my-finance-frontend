<div class="modal-backdrop">


  <div class="modal-box">



    <div class="modal-header">


      <h2>

        {{

        account

        ?

        ('account.edit_title' | translate)

        :

        ('account.new_title' | translate)

        }}


      </h2>




      <button

        class="close-btn"

        type="button"

        (click)="close.emit()">



        ×



      </button>



    </div>









    <div class="input-group">


      <label>


        {{'account.name' | translate}}


      </label>





      <input


        type="text"


        [(ngModel)]="name"


        [placeholder]="

        'account.name_placeholder' | translate

        ">


    </div>









    <div class="input-group">


      <label>


        {{'account.initial_balance' | translate}}


        (

        {{'currency.symbol' | translate}}

        )


      </label>





      <input


        type="number"


        [(ngModel)]="balance"


        min="0"


        [placeholder]="

        'account.balance_placeholder' | translate

        ">


    </div>









    <div class="input-group">


      <label>


        {{'account.color' | translate}}


      </label>





      <input


        type="color"


        [(ngModel)]="color"


        class="color-input">



    </div>









    <div class="input-group">


      <label>


        {{'account.type' | translate}}


      </label>





      <select


        [(ngModel)]="type"


        class="form-control">





        <option


          *ngFor="let t of accountTypes"


          [value]="t.value">



          {{t.label | translate}}



        </option>





      </select>



    </div>









    <div class="input-group checkbox-group">


      <input


        type="checkbox"


        [(ngModel)]="is_debt"


        id="is_debt">





      <label


        for="is_debt">



        {{'account.debt_label' | translate}}



      </label>



    </div>









    <div class="modal-actions">



      <button


        class="btn-cancel"


        type="button"


        (click)="close.emit()">



        {{'common.cancel' | translate}}



      </button>







      <button


        class="btn-save"


        type="button"


        (click)="save()">



        {{

        account

        ?

        ('account.save_changes' | translate)

        :

        ('account.create' | translate)

        }}



      </button>



    </div>





  </div>


</div>
