<div class="summary-container">

  <dl class="stat-box">
    <dt class="stat-label">Net Worth</dt>

  </dl>

  <dl class="stat-box">
    <dt class="stat-label">Assets</dt>
    <dd class="stat-value">{{ totalAssets | number:'1.0-0' }} تومان</dd>
  </dl>

  <dl class="stat-box">
    <dt class="stat-label">Liabilities</dt>
    <dd class="stat-value">{{ totalLiabilities | number:'1.0-0' }} تومان</dd>
  </dl>

</div>
